# ============================
# SPS - Products & Services Module
# Format: SPS-{SERVICE}-{METHOD}-{CODE}
# ============================

# ============================
# Product
# ============================
SPS-PRO-CRE-001 = product cannot be created with empty request.
SPS-PRO-CRE-003 = A product with this name already exists, to avoid confusion please use a different name.
SPS-PRO-CRE-004 = Products can only be assigned to a leaf-node classification.
SPS-PRO-UPD-002 = Referenced entity does not exist.
SPS-PRO-FID-002 = Product not found.

# ============================
# Product Classification
# ============================
SPS-PCL-CRE-001 = product classification cannot be created with empty request.
SPS-PCL-CRE-002 = Referenced parent product classification does not exist.
SPS-PCL-CRE-003 = A product Classification with this name already exists, to avoid confusion please use a different name.
SPS-PCL-UPD-002 = Referenced parent product classification does not exist.
SPS-PCL-UPD-003 = A product Classification with this name already exists, to avoid confusion please use a different name.
SPS-PCL-FID-002 = Product classification not found.

